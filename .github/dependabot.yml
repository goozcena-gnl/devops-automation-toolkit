version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-quality:
        patterns: ["bandit*", "build", "mypy", "librt", "ast-serialize", "pip-audit", "pytest*", "ruff", "twine", "types-*", "uv"]
      pydantic:
        patterns: ["pydantic", "pydantic-core"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
