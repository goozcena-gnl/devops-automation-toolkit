version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-quality:
        patterns: ["bandit*", "build", "mypy", "pip-audit", "pip-tools", "pytest*", "ruff", "twine", "types-*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
