name: Release Preflight

on:
  pull_request:
    paths:
      - .github/workflows/release-preflight.yml
      - pyproject.toml
      - src/devops_toolkit/version.py
      - tools/build_release.py
      - requirements/dev-constraints.txt
      - scripts/linux/linux-triage.sh
      - scripts/workstation/devops-workstation-audit.ps1
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full 40-character SHA of the candidate commit (no tag or publication)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-preflight-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packaging:
    name: Packaging and reproducibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PIP_CONSTRAINT: ${{ github.workspace }}/requirements/dev-constraints.txt
    steps:
      - name: Validate manual candidate SHA
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'A full lowercase 40-character SHA is required'; exit 1; }
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements/dev-constraints.txt
      - name: Install constrained release tooling
        run: python -m pip install -e '.[dev]'
      - name: Verify locked dependency graph
        run: python tools/check_dev_constraints.py check
      - name: Build and check distributions; reproduce source ZIP
        shell: bash
        run: |
          set -euo pipefail
          python -m build
          python -m twine check dist/*.whl dist/*.tar.gz
          python tools/build_release.py
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          archive="dist/devops-automation-toolkit-${version}.zip"
          test -s "$archive"
          cp "$archive" "$RUNNER_TEMP/source-first.zip"
          python tools/build_release.py
          cmp "$RUNNER_TEMP/source-first.zip" "$archive"
          sha256sum dist/*.whl dist/*.tar.gz "$archive" > dist/SHA256SUMS.txt
      - name: Clean wheel install and packaged schemas
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/rc-wheel-smoke"
          "$RUNNER_TEMP/rc-wheel-smoke/bin/python" -m pip install --constraint "$PIP_CONSTRAINT" dist/*.whl
          "$RUNNER_TEMP/rc-wheel-smoke/bin/python" -m pip check
          "$RUNNER_TEMP/rc-wheel-smoke/bin/python" - <<'PY'
          import importlib.metadata
          import json
          import tomllib
          from importlib import resources
          from pathlib import Path
          expected = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          actual = importlib.metadata.version('devops-automation-toolkit')
          assert actual == expected, (actual, expected)
          schemas = list(resources.files('devops_toolkit').joinpath('resources', 'schemas').glob('*.json'))
          assert schemas, 'Wheel does not contain packaged JSON schemas'
          for path in schemas:
              json.loads(path.read_text(encoding='utf-8'))
          print(f'Wheel {actual}: {len(schemas)} packaged JSON schemas validated')
          PY
          expected=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$("$RUNNER_TEMP/rc-wheel-smoke/bin/devops-toolkit" version)" = "$expected"
      - name: Clean sdist install
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/rc-sdist-smoke"
          "$RUNNER_TEMP/rc-sdist-smoke/bin/python" -m pip install --constraint "$PIP_CONSTRAINT" dist/*.tar.gz
          "$RUNNER_TEMP/rc-sdist-smoke/bin/python" -m pip check
          expected=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$("$RUNNER_TEMP/rc-sdist-smoke/bin/devops-toolkit" version)" = "$expected"
      - name: Archive validation evidence (not a release)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-preflight-dist
          path: dist/*
          retention-days: 7
