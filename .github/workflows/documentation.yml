name: Documentation

on:
  pull_request:
    paths: ['docs/**', 'README.md', 'src/devops_toolkit/catalog.py', 'tools/generate_catalog.py']

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -e .
      - run: python tools/check_docs.py
      - run: python tools/generate_catalog.py
      - name: Ensure generated catalog is committed
        run: git diff --exit-code docs/generated-catalog.md
