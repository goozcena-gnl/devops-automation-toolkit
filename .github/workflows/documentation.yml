name: Documentation

on:
  pull_request:
    paths: ['docs/**', 'README.md', 'src/devops_toolkit/catalog.py', 'tools/generate_catalog.py']

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PIP_CONSTRAINT: ${{ github.workspace }}/requirements/dev-constraints.txt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements/dev-constraints.txt
      - run: python -m pip install -e ".[dev]"
      - run: python tools/check_dev_constraints.py check
      - run: python tools/check_docs.py
      - run: python tools/generate_catalog.py
      - name: Ensure generated catalog is committed
        run: git diff --exit-code docs/generated-catalog.md
