name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    timeout-minutes: 15
    env:
      PIP_CONSTRAINT: ${{ github.workspace }}/requirements/dev-constraints.txt
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/dev-constraints.txt
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Verify locked dependency graph
        run: python tools/check_dev_constraints.py check
      - name: Ruff format
        run: ruff format --check .
      - name: Ruff lint
        run: ruff check .
      - name: Mypy
        run: mypy src
      - name: Unit and contract tests
        run: pytest tests/unit tests/contract --cov-report=xml
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7

  native-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Bash syntax
        run: bash -n scripts/linux/linux-triage.sh
      - name: ShellCheck
        run: shellcheck scripts/linux/linux-triage.sh

  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        # v1.7.12 release tag resolves to 914e7df21a07ef503a81201c76d2b11c789d3fca.
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install Plumber alignment checker dependency
        run: python -m pip install --constraint requirements/dev-constraints.txt "PyYAML>=6,<7"
      - name: Verify Plumber action and binary alignment
        timeout-minutes: 2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/check_plumber_alignment.py .github/workflows/plumber.yml

  powershell-static:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PIP_CONSTRAINT: ${{ github.workspace }}/requirements/dev-constraints.txt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements/dev-constraints.txt
      - name: Parse PowerShell
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/workstation/devops-workstation-audit.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
          $findings = Invoke-ScriptAnalyzer -Path scripts/workstation/devops-workstation-audit.ps1 -Severity Error,Warning
          if ($findings) {
            $findings | Format-Table -AutoSize | Out-String | Write-Error
            exit 1
          }
      - name: Execute Workstation Doctor contract smoke test
        shell: pwsh
        run: |
          function Assert-WorkstationDoctorExitCode {
            param([int]$Code)
            if ($Code -notin @(0, 5)) {
              throw "Unexpected Workstation Doctor exit code: $Code"
            }
            # GitHub's pwsh wrapper also checks LASTEXITCODE after the step.
            $global:LASTEXITCODE = 0
          }

          # Deterministically verify success (0), partial (5), and failure (1).
          foreach ($case in @(
            @{ Code = 0; Accepted = $true },
            @{ Code = 5; Accepted = $true },
            @{ Code = 1; Accepted = $false }
          )) {
            $global:LASTEXITCODE = $case.Code
            $accepted = $true
            try {
              Assert-WorkstationDoctorExitCode -Code $LASTEXITCODE
            } catch {
              $accepted = $false
            }
            if ($accepted -ne $case.Accepted -or ($accepted -and $LASTEXITCODE -ne 0)) {
              throw "Workstation Doctor exit-code contract failed: $($case.Code)"
            }
          }
          $global:LASTEXITCODE = 0

          & ./scripts/workstation/devops-workstation-audit.ps1 `
            -RequiredTools git,ssh `
            -OutputPath workstation-report.json
          $collectorExit = $LASTEXITCODE
          Assert-WorkstationDoctorExitCode -Code $collectorExit
          Write-Host "Accepted Workstation Doctor exit code: $collectorExit"
      - name: Validate Workstation Doctor report schema
        shell: pwsh
        run: |
          python -m pip install jsonschema referencing
          python scripts/workstation/validate_workstation_report.py
      - name: Upload Workstation Doctor smoke report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workstation-doctor-windows-smoke
          path: workstation-report.json
          if-no-files-found: warn
          retention-days: 3
