name: insecure
on:
  pull_request_target:
permissions: write-all
jobs:
  audit:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: logs
          path: logs/
      - run: echo "${{ github.event.pull_request.title }}"
